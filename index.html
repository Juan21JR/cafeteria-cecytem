<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafetería CECyTEM</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<header>
<h1>🍔 Cafetería CECyTEM</h1>
<p>Sabor, energía y bienestar</p>

<button onclick="abrirAdmin()">
👩‍💼 Encargada
</button>
</header>

<section class="menu">

<div class="dias">
<button onclick="mostrarDia('lunes')">Lunes</button>
<button onclick="mostrarDia('martes')">Martes</button>
<button onclick="mostrarDia('miercoles')">Miércoles</button>
<button onclick="mostrarDia('jueves')">Jueves</button>
<button onclick="mostrarDia('viernes')">Viernes</button>
</div>

<div id="productos" class="productos"></div>

</section>

<!-- PEDIDO -->

<div class="modal" id="modalPedido">

<div class="modal-content">

<h2>Realizar pedido</h2>

<p id="productoSeleccionado"></p>

<input
type="text"
id="nombreAlumno"
placeholder="Nombre">

<input
type="text"
id="grupoAlumno"
placeholder="Grupo">

<button onclick="confirmarPedido()">
Confirmar pedido
</button>

<button onclick="cerrarPedido()">
Cancelar
</button>

</div>

</div>

<!-- QR -->

<div class="modal" id="modalQR">

<div class="modal-content">

<h2>✅ Pedido registrado</h2>

<div id="datosPedido"></div>

<div id="qr"></div>

<br>

<button onclick="cerrarQR()">
Cerrar
</button>

</div>

</div>

<!-- ADMIN -->

<div class="modal" id="modalAdmin">

<div class="modal-content">

<h2>Administración</h2>

<button onclick="agregarProducto()">
➕ Agregar Producto
</button>

<br><br>

<div id="adminLista"></div>

<button onclick="cerrarAdmin()">
Cerrar
</button>

</div>

</div>

<script>

let productoActual=null;

let menus=
JSON.parse(localStorage.getItem("menus")) || {

lunes:[
{
nombre:"Tacos Dorados",
precio:35
},
{
nombre:"Torta de Jamón",
precio:40
}
],

martes:[
{
nombre:"Hamburguesa",
precio:50
}
],

miercoles:[
{
nombre:"Quesadillas",
precio:30
}
],

jueves:[
{
nombre:"Tacos de Bistec",
precio:45
}
],

viernes:[
{
nombre:"Pizza Individual",
precio:45
}
]

};

function guardarMenus(){
localStorage.setItem(
"menus",
JSON.stringify(menus)
);
}

function mostrarDia(dia){

const contenedor=
document.getElementById("productos");

contenedor.innerHTML="";

menus[dia].forEach(producto=>{

contenedor.innerHTML+=`

<div class="producto">

<h3>${producto.nombre}</h3>

<p>
Precio: $${producto.precio}
</p>

<button
onclick="pedirProducto(
'${producto.nombre}',
${producto.precio}
)">
Pedir
</button>

</div>

`;

});

}

mostrarDia("lunes");

function pedirProducto(nombre,precio){

productoActual={
nombre,
precio
};

document.getElementById(
"productoSeleccionado"
).innerHTML=
`Producto: ${nombre} ($${precio})`;

document.getElementById(
"modalPedido"
).style.display="flex";

}

function cerrarPedido(){

document.getElementById(
"modalPedido"
).style.display="none";

}

function confirmarPedido(){

const nombre=
document.getElementById(
"nombreAlumno"
).value;

const grupo=
document.getElementById(
"grupoAlumno"
).value;

if(!nombre || !grupo){

alert(
"Completa nombre y grupo"
);

return;

}

const pedidoId=
"PED-"+Date.now();

cerrarPedido();

document.getElementById(
"datosPedido"
).innerHTML=`

<p><b>ID:</b> ${pedidoId}</p>

<p><b>Alumno:</b> ${nombre}</p>

<p><b>Grupo:</b> ${grupo}</p>

<p><b>Producto:</b>
${productoActual.nombre}</p>

<p><b>Total:</b>
$${productoActual.precio}</p>

`;

document.getElementById("qr").innerHTML="";

new QRCode(
document.getElementById("qr"),
{
text:
JSON.stringify({
id:pedidoId,
alumno:nombre,
grupo:grupo,
producto:productoActual.nombre,
total:productoActual.precio
}),
width:220,
height:220
});

document.getElementById(
"modalQR"
).style.display="flex";

}

function cerrarQR(){

document.getElementById(
"modalQR"
).style.display="none";

}

function abrirAdmin(){

document.getElementById(
"modalAdmin"
).style.display="flex";

renderAdmin();

}

function cerrarAdmin(){

document.getElementById(
"modalAdmin"
).style.display="none";

}

function renderAdmin(){

const lista=
document.getElementById(
"adminLista"
);

lista.innerHTML="";

Object.keys(menus)
.forEach(dia=>{

lista.innerHTML+=`
<h3>${dia.toUpperCase()}</h3>
`;

menus[dia].forEach(
(producto,index)=>{

lista.innerHTML+=`

<div class="admin-item">

${producto.nombre}
-
$${producto.precio}

<button
onclick="
editarProducto(
'${dia}',
${index}
)
">
✏️
</button>

<button
onclick="
eliminarProducto(
'${dia}',
${index}
)
">
🗑️
</button>

</div>

`;

});

});

}

function agregarProducto(){

const dia=
prompt(
"Dia (lunes,martes,miercoles,jueves,viernes)"
);

if(!menus[dia]) return;

const nombre=
prompt("Nombre");

const precio=
Number(
prompt("Precio")
);

menus[dia].push({
nombre,
precio
});

guardarMenus();

renderAdmin();

mostrarDia(dia);

}

function editarProducto(
dia,
index
){

const producto=
menus[dia][index];

const nombre=
prompt(
"Nombre",
producto.nombre
);

const precio=
prompt(
"Precio",
producto.precio
);

producto.nombre=nombre;
producto.precio=Number(precio);

guardarMenus();

renderAdmin();

}

function eliminarProducto(
dia,
index
){

if(
confirm("Eliminar producto")
){

menus[dia].splice(
index,
1
);

guardarMenus();

renderAdmin();

}

}

</script>

</body>
</html>
