<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Encargada | Cafetería CECyTEM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f5f3;color:#222}header{background:#006b3f;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.titulo{display:flex;align-items:center;gap:15px}.titulo img{width:60px;height:60px;object-fit:contain;border-radius:10px;background:white}.titulo h1{margin:0;font-size:25px}.titulo p{margin:5px 0 0;opacity:.9}.btn-salir,.btn-actualizar{border:0;padding:11px 18px;border-radius:10px;font-weight:bold;cursor:pointer}.btn-salir{background:white;color:#006b3f}.btn-actualizar{background:#006b3f;color:white}.contenedor{width:95%;max-width:1200px;margin:25px auto}.barra-superior{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}.barra-superior h2{margin:0}.estadisticas{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}.estadistica{background:white;padding:20px;border-radius:15px;box-shadow:0 3px 12px #0001}.estadistica h3{margin:0 0 8px;font-size:15px;color:#666}.estadistica strong{font-size:28px;color:#006b3f}#listaPedidos,#listaAlumnos{display:grid;gap:16px}.pedido,.alumno-card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 15px #0001;border-left:6px solid #006b3f}.pedido-cabecera{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:15px;margin-bottom:15px}.pedido-cabecera h3,.alumno-card h3{margin:0;color:#006b3f}.fecha{color:#777;font-size:14px}.datos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}.dato{background:#f6f8f7;padding:12px;border-radius:10px;overflow-wrap:anywhere}.dato strong{display:block;color:#555;font-size:13px;margin-bottom:4px}.productos{margin:15px 0}.producto{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee}.total{font-size:21px;font-weight:bold;color:#006b3f;text-align:right;margin-top:15px}.pago{margin-top:15px;padding:12px;border-radius:10px;background:#eef7f1}.comprobante{margin-top:10px}.comprobante a{color:#006b3f;font-weight:bold}.acciones{margin-top:20px;padding-top:15px;border-top:1px solid #ddd}.acciones label{display:block;font-weight:bold;margin-bottom:8px}.estado{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px;background:white}.sin-pedidos,.sin-alumnos{background:white;padding:35px;text-align:center;border-radius:18px;box-shadow:0 3px 12px #0001}.emoji{font-size:45px}#cargando,#cargandoAlumnos{text-align:center;padding:25px;color:#666}.seccion-titulo{margin:35px 0 16px}.seccion-titulo p{color:#666}.alumnos-barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.alumnos-barra input{flex:1;min-width:220px;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:15px}.alumno-card p{margin:8px 0;overflow-wrap:anywhere}.alumno-id{font-size:12px;color:#555;background:#f4f7f5;padding:8px;border-radius:8px;overflow-wrap:anywhere}@media(max-width:700px){.estadisticas{grid-template-columns:1fr}.datos{grid-template-columns:1fr}.titulo h1{font-size:20px}header{align-items:flex-start}.pedido,.alumno-card{padding:16px}}
</style></head><body>
<header><div class="titulo"><img src="imagenes/cecylogo.jpg" alt="Logo CECyTEM"><div><h1>👩‍💼 Panel de Encargada</h1><p>Cafetería CECyTEM</p></div></div><button class="btn-salir" onclick="cerrarSesion()">🚪 Cerrar sesión</button></header>
<main class="contenedor">
<div class="barra-superior"><div><h2>📋 Pedidos recibidos</h2><p>Administra los pedidos de los estudiantes.</p></div><button class="btn-actualizar" onclick="cargarPedidos()">🔄 Actualizar pedidos</button></div>
<section class="estadisticas"><div class="estadistica"><h3>📦 Pedidos</h3><strong id="totalPedidos">0</strong></div><div class="estadistica"><h3>⏳ Pendientes</h3><strong id="pedidosPendientes">0</strong></div><div class="estadistica"><h3>💰 Ventas</h3><strong id="ventasTotales">$0</strong></div></section>
<div id="cargando">🔄 Cargando pedidos...</div><section id="listaPedidos"></section>
<section class="seccion-titulo"><h2>🎓 Alumnos registrados</h2><p>Consulta los datos de los alumnos y sus identificadores QR.</p></section>
<div class="alumnos-barra"><input id="buscarAlumno" type="search" placeholder="Buscar por nombre, grupo o ID..."><button class="btn-actualizar" onclick="cargarAlumnos()">🔄 Actualizar alumnos</button></div>
<div id="cargandoAlumnos">Cargando alumnos...</div><section id="listaAlumnos"></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,collection,getDocs,query,orderBy,doc,updateDoc}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBLx0K7VlFsgJ_Hb_xeDTOFAmS_Kgwxnos",authDomain:"cafeteria-cecytem.firebaseapp.com",projectId:"cafeteria-cecytem",storageBucket:"cafeteria-cecytem.firebasestorage.app",messagingSenderId:"756924498889",appId:"1:756924498889:web:b370685487cfe397eb9e18",measurementId:"G-QM14B3YP62"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
onAuthStateChanged(auth,usuario=>{if(!usuario){window.location.href="index.html";return;}cargarPedidos();cargarAlumnos();});
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.cargarPedidos=async function(){const lista=document.getElementById("listaPedidos"),cargando=document.getElementById("cargando");cargando.style.display="block";lista.innerHTML="";try{const q=query(collection(db,"pedidos"),orderBy("fecha","desc")),res=await getDocs(q);document.getElementById("totalPedidos").textContent=res.size;let pendientes=0,ventas=0;if(res.empty){lista.innerHTML='<div class="sin-pedidos"><div class="emoji">📭</div><h2>No hay pedidos todavía</h2><p>Cuando un estudiante haga un pedido, aparecerá aquí.</p></div>';}res.forEach(d=>{const p=d.data(),id=d.id,estado=p.estado||"Pendiente",total=Number(p.total)||0;if(estado.toLowerCase()==="pendiente")pendientes++;ventas+=total;const fecha=p.fecha?.toDate?p.fecha.toDate().toLocaleString("es-MX"):"Sin fecha";let productosHTML="";if(Array.isArray(p.productos)){productosHTML=p.productos.map(x=>`<div class="producto"><span>${Number(x.cantidad)||1} × ${escapeHTML(x.nombre||"Producto")}</span><strong>$${(Number(x.precio)||0).toFixed(2)}</strong></div>`).join("");}else{productosHTML=`<div class="producto">${escapeHTML(p.producto||"Sin productos")}</div>`;}const comprobante=p.comprobante?`<div class="comprobante">📄 <a href="${escapeHTML(p.comprobante)}" target="_blank" rel="noopener">Ver comprobante</a></div>`:"";const card=document.createElement("article");card.className="pedido";card.innerHTML=`<div class="pedido-cabecera"><div><h3>🧾 Pedido #${escapeHTML(id.slice(0,8))}</h3><div class="fecha">${escapeHTML(fecha)}</div></div></div><div class="datos"><div class="dato"><strong>👤 Estudiante</strong>${escapeHTML(p.nombre||"No indicado")}</div><div class="dato"><strong>🏫 Grupo</strong>${escapeHTML(p.grupo||"No indicado")}</div><div class="dato"><strong>💳 Forma de pago</strong>${escapeHTML(p.metodoPago||"No indicado")}</div><div class="dato"><strong>📌 Estado actual</strong>${escapeHTML(estado)}</div></div><div class="productos"><h4>🍔 Productos</h4>${productosHTML}</div><div class="pago"><strong>💰 Total del pedido:</strong> $${total.toFixed(2)}${comprobante}</div><div class="total">Total: $${total.toFixed(2)}</div><div class="acciones"><label>🔄 Cambiar estado</label><select class="estado" aria-label="Estado del pedido"><option ${estado==="Pendiente"?'selected':''}>Pendiente</option><option ${estado==="Preparando"?'selected':''}>Preparando</option><option ${estado==="Listo"?'selected':''}>Listo</option><option ${estado==="Entregado"?'selected':''}>Entregado</option></select><p class="mensaje-estado" aria-live="polite"></p></div>`;const sel=card.querySelector("select");sel.addEventListener("change",async()=>{sel.disabled=true;try{await updateDoc(doc(db,"pedidos",id),{estado:sel.value});card.querySelector(".mensaje-estado").textContent="Estado guardado.";await cargarPedidos();}catch(e){console.error(e);card.querySelector(".mensaje-estado").textContent="No se pudo guardar. Revisa las reglas de Firestore.";sel.disabled=false;}});lista.appendChild(card);});document.getElementById("pedidosPendientes").textContent=pendientes;document.getElementById("ventasTotales").textContent="$"+ventas.toFixed(2);cargando.style.display="none";}catch(e){console.error(e);cargando.textContent="❌ No se pudieron cargar los pedidos. Revisa las reglas de Firestore.";}};
let alumnosCache=[];window.cargarAlumnos=async function(){const lista=document.getElementById("listaAlumnos"),cargando=document.getElementById("cargandoAlumnos");cargando.style.display="block";lista.innerHTML="";try{const res=await getDocs(query(collection(db,"alumnos"),orderBy("fechaRegistro","desc")));alumnosCache=res.docs.map(d=>({id:d.id,...d.data()}));mostrarAlumnos();cargando.style.display="none";}catch(e){console.error("Error cargando alumnos:",e);cargando.textContent="❌ No se pudieron consultar los alumnos. Verifica que la colección alumnos exista y que las reglas permitan la lectura a la encargada.";}};
function mostrarAlumnos(){const lista=document.getElementById("listaAlumnos"),filtro=document.getElementById("buscarAlumno").value.trim().toLowerCase();const filtrados=alumnosCache.filter(a=>[a.nombre,a.grupo,a.id].some(v=>String(v||"").toLowerCase().includes(filtro)));if(!filtrados.length){lista.innerHTML='<div class="sin-alumnos">🎓 No hay alumnos que coincidan con la búsqueda.</div>';return;}lista.innerHTML=filtrados.map(a=>`<article class="alumno-card"><h3>🎓 ${escapeHTML(a.nombre||"Sin nombre")}</h3><p><strong>Grupo:</strong> ${escapeHTML(a.grupo||"Sin grupo")}</p><p><strong>Semestre:</strong> ${escapeHTML(a.semestreTexto||a.semestre||"Sin dato")}</p><p class="alumno-id"><strong>ID QR:</strong> ${escapeHTML(a.id)}</p></article>`).join("");}
document.getElementById("buscarAlumno").addEventListener("input",mostrarAlumnos);
window.cerrarSesion=async()=>{try{await signOut(auth);window.location.href="index.html";}catch(e){console.error("Error cerrando sesión",e);alert("No se pudo cerrar la sesión.");}};
</script></body></html>
